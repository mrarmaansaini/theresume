<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="50%" stop-color="#1e2540"/>
      <stop offset="100%" stop-color="#0f1220"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#2e3859" stroke-width="6"/>

  <!-- Subtle Inner Grid / Lens Rings -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#252e4d" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#2e3a5f" stroke-width="2"/>

  <!-- Modern Document Glyph Base -->
  <g filter="url(#glow)">
    <path d="M172 136 C172 122.7, 182.7 112, 196 112 L280 112 L340 172 L340 376 C340 389.3, 329.3 400, 316 400 L196 400 C182.7 400, 172 389.3, 172 376 Z" 
          fill="#1b2238" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Folded Corner -->
    <path d="M280 112 L280 166 C280 172.6, 285.4 178, 292 178 L340 178 Z" 
          fill="url(#accentGrad)" opacity="0.9"/>

    <!-- Precision Fingerprint / RoleLens Core Matrix -->
    <!-- Arc 1 -->
    <path d="M216 232 C236 214, 276 214, 296 232" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
    <!-- Arc 2 -->
    <path d="M204 264 C232 238, 280 238, 308 264" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Arc 3 Center Loop -->
    <path d="M228 296 C240 278, 272 278, 284 296 C288 304, 288 322, 280 334 C272 344, 256 348, 244 340" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Arc 4 Lower Anchor -->
    <path d="M212 336 C220 354, 244 366, 268 362 C290 358, 304 340, 304 316" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Precision Crosshair Focus Dots -->
  <circle cx="136" cy="256" r="6" fill="#34d399"/>
  <circle cx="376" cy="256" r="6" fill="#818cf8"/>
  <circle cx="256" cy="80" r="5" fill="#34d399" opacity="0.6"/>
  <circle cx="256" cy="432" r="5" fill="#818cf8" opacity="0.6"/>
</svg>
